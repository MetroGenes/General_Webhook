server:
  addr: ":8080"
  max_in_flight: 16
  max_in_flight_bytes: 33554432  # 32 MiB
  rate_limit:
    pre_auth_per_ip: {burst: 120, per_second: 20} # 鉴权前按 IP 保护
    global: {burst: 120, per_second: 2}          # 仅通过来源鉴权后消费
    source_per_ip: {burst: 30, per_second: 0.5}
    admin_per_ip: {burst: 60, per_second: 1}
  # 标准部署没有入站反代，保持未配置。仅在批准的内部 relay 使用固定地址时，
  # 才填写该 relay 的精确 IP/CIDR，不要直接信任整个私网网段。
  # trusted_proxies:
  #   - "172.30.0.10/32"

admin:
  header: Authorization
  token: ${ADMIN_TOKEN}

log:
  level: "info"          # debug | info | warn | error

store:
  path: "data/webhook.db"
  retention: 720h
  retain_payload: false

queue:
  workers: 4
  buffer: 256
  max_retries: 2        # 首次尝试之后最多再重试 2 次（总计 3 次）
  retry_base: 1s
  max_retry_delay: 15m
  max_retry_age: 24h     # 到期的 pending/retrying 动作不再派发；人工 replay 重新起算

# Deadman 心跳 (可选, 默认关闭): 进程周期性向外部监控端点 POST 存活信号。
# 标准部署不发布宿主端口, 外部探针无法入站访问 /readyz, 因此由进程自己
# 主动向 Uptime Kuma Push 监控项报告 up/down。
# URL/token 经环境变量提供; 全部 URL 为空时整个模块不启动 (fail closed)。
#   - mode: kuma (默认): query.status=up/down，且需要 2xx + {"ok":true} 确认
#   - mode: healthchecks: 正常 POST 原路径，不健康时在路径末尾追加 /fail
#     旧 mode: push 保留为 healthchecks 别名；UUID URL 为 https://hc-ping.com/<uuid>
#   - mode: json: 始终 POST 原 URL，负载带 status/exit_code/stats
# 最多 16 个独立 target worker；host 最多 128 字节。
# 使用内部 http:// Kuma 时，把 allow_http 改为 true，并重新构建自有标签镜像。
heartbeat:
  interval: 60s
  timeout: 10s
  host: ${HOST_LABEL}
  targets:
    - name: kuma
      url: ${HEARTBEAT_URL} # Kuma 生成的 https://.../api/push/<token>?status=up&msg=OK&ping=
      token: ${HEARTBEAT_TOKEN}
      mode: kuma
      allow_http: false
    - name: cf-pages
      url: ${CF_HEARTBEAT_URL}
      token: ${CF_HEARTBEAT_TOKEN}
      mode: json

sources:
  # 示例 1: 内部 relay 转发的 GitHub push, HMAC 校验, 通知飞书 + 转发自定义服务
  # 默认 Docker 部署不接受公网 GitHub 直连，也不要为此添加宿主端口。
  # relay 必须用共享 secret 对 timestamp + "\n" + delivery_id + "\n" + 原始 body 重签。
  # 升级旧 relay 时同步改签名；如需保留仅 body 签名，显式设 signed_headers: []。
  - name: github
    auth:
      type: hmac
      header: X-Hub-Signature-256
      secret: ${GITHUB_SECRET}
      signed_headers: [timestamp, delivery_id, body]
    extract:                       # 变量名 -> JSONPath
      event:  "$.action"
      branch: "$.ref"
      repo:   "$.repository.full_name"
    rules:                         # 全部命中才触发 (正则)
      - var: branch
        regex: "^refs/heads/(main|master)$"
    actions:
      # 飞书群机器人
      - type: http
        url: ${secret:FEISHU_BOT}
        method: POST
        url_allowlist:
          - "open.feishu.cn"
          - "https://open.feishu.cn/"
        headers:
          Content-Type: application/json
        body: |
          {
            "msg_type": "text",
            "content": {
              "text": "🚀 ${repo} pushed to ${branch}"
            }
          }
      # 转发到 n8n 工作流
      - type: http
        url: "https://n8n.local/webhook/deploy"
        method: POST
        allow_private: true
        url_allowlist:
          - "n8n.local"
        body: |
          {
            "event": "${event}",
            "branch": "${branch}",
            "repo": "${repo}"
          }

  # 示例 2: 批准的同网络容器, token 校验, 执行镜像内脚本
  - name: custom
    auth:
      type: token
      header: X-Webhook-Token
      secret: ${CUSTOM_TOKEN}
    extract:
      job: "$.job"
    rules: []                      # 空 = 总是触发
    actions:
      - type: exec
        command: "/opt/general-webhook/scripts/run.sh"
        args: ["${job}"]
        timeout: 300s

  # 示例 3: 宝塔面板告警 -> Telegram bot
  # 同一受控 Docker 网络内的宝塔/relay「告警 -> 自定义消息通道」配置:
  #   请求URL: http://general-webhook:8080/webhook/bt
  #   请求头: {"X-Webhook-Token": "<BT_TOKEN 的值>"}
  #   请求体: 保持默认 {"title":"$title","msg":"$msg","type":"$type"}
  # 公网宝塔不能直接调用默认部署，必须经独立内部 relay；禁止添加 ports 或公网反代。
  # 若 Telegram action 需要出站代理，只改下面的目标 url；这不是 Webhook 入站反代。
  - name: bt
    auth:
      type: token
      header: X-Webhook-Token
      secret: ${BT_TOKEN}
    extract:                       # 对应宝塔的 $title/$msg/$type
      title: "$.title"
      msg:   "$.msg"
      type:  "$.type"
    rules: []                      # 空 = 所有告警都转发
    actions:
      - type: http
        url: "https://api.telegram.org/bot${secret:TG_BOT_TOKEN}/sendMessage"
        method: POST
        url_allowlist:
          - "api.telegram.org"
        headers:
          Content-Type: application/json
        body: |
          {
            "chat_id": "${secret:TG_CHAT_ID}",
            "text": "🛎 宝塔告警 [${type}]\n${title}\n${msg}"
          }

  # 示例 4: 钉钉群机器人 (演示其他 IM 渠道)
  - name: dingtalk-demo
    auth:
      type: token
      header: X-Webhook-Token
      secret: ${DINGTALK_WEBHOOK_TOKEN}
    extract:
      message: "$.message"
    rules: []
    actions:
      - type: http
        url: "https://oapi.dingtalk.com/robot/send?access_token=${secret:DINGTALK_TOKEN}"
        method: POST
        url_allowlist:
          - "oapi.dingtalk.com"
        body: |
          {
            "msgtype": "text",
            "text": {
              "content": "${message}"
            }
          }
