name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: coverage floor
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if (total + 0 < 60) exit 1 }'

      - name: race test
        run: go test -race -count=1 ./...

      - name: build and validate example config
        env:
          ADMIN_TOKEN: admin-token-for-ci-123456
          GITHUB_SECRET: github-secret-for-ci-123456
          FEISHU_BOT: https://open.feishu.cn/open-apis/bot/v2/hook/test
          CUSTOM_TOKEN: custom-token-for-ci-123456
          BT_TOKEN: bt-token-for-ci-123456
          TG_BOT_TOKEN: telegram-token-for-ci
          TG_CHAT_ID: "123456"
          DINGTALK_TOKEN: dingtalk-token-for-ci
          DINGTALK_WEBHOOK_TOKEN: dingtalk-inbound-for-ci-123456
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/general-webhook ./cmd/server
          /tmp/general-webhook -check-config -config configs/webhooks.yaml

      - name: validate Compose
        env:
          WEBHOOK_IMAGE: general-webhook:ci
          WEBHOOK_DATA_DIR: /tmp/general-webhook-data
        run: docker compose config -q

      - name: build Docker image
        run: docker build --pull --tag general-webhook:ci .

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: module inventory (lightweight SBOM)
        run: go list -m -json all > module-sbom.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-sbom
          path: module-sbom.json
