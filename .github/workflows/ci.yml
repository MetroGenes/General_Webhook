name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          check-latest: true

      - name: resolved Go toolchain
        run: go version

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: coverage floor
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if (total + 0 < 60) exit 1 }'

      - name: race test
        run: go test -race -count=1 ./...

      - name: build and validate example config
        env:
          ADMIN_TOKEN: admin-token-for-ci-123456
          GITHUB_SECRET: github-secret-for-ci-123456
          FEISHU_BOT: https://open.feishu.cn/open-apis/bot/v2/hook/test
          CUSTOM_TOKEN: custom-token-for-ci-123456
          BT_TOKEN: bt-token-for-ci-123456
          TG_BOT_TOKEN: telegram-token-for-ci
          TG_CHAT_ID: "123456"
          DINGTALK_TOKEN: dingtalk-token-for-ci
          DINGTALK_WEBHOOK_TOKEN: dingtalk-inbound-for-ci-123456
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/general-webhook ./cmd/server
          /tmp/general-webhook -check-config -config configs/webhooks.yaml

      - name: Process crash recovery and graceful shutdown
        env:
          REVIEW_BINARY: /tmp/general-webhook
        run: go test -tags=process_integration -count=1 -timeout=65s ./cmd/server

      - name: Uptime Kuma integration
        run: bash scripts/test-kuma.sh

      - name: validate Compose
        env:
          WEBHOOK_IMAGE: general-webhook:ci
          WEBHOOK_DATA_DIR: /tmp/general-webhook-data
        run: docker compose config -q

      - name: build Docker image
        run: docker build --pull --tag general-webhook:ci .

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -version
          govulncheck ./...

      - name: module inventory (lightweight SBOM)
        run: go list -m -json all > module-sbom.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-sbom
          path: module-sbom.json

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
            type=raw,value=1.0.0,priority=1000,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: ARM64 emulation for runtime image steps
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish verified commit
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: VCS_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Published image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Published image digest: %s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
